<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纳米光催化技术 - 企业官网示例</title>
  <style>
    /* ===== 全局 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #333;
      line-height: 1.6;
    }
    a { text-decoration: none; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ===== 导航栏 ===== */
    header {
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .logo {
      font-size: 1.4em;
      font-weight: bold;
      color: #0056b3;
    }
    .nav-links a {
      margin-left: 24px;
      color: #555;
      font-size: 0.95em;
    }
    .nav-links a:hover { color: #0056b3; }

    /* ===== 首屏大图 Hero ===== */
    .hero {
      background: linear-gradient(135deg, #0056b3, #00a8e8);
      color: #fff;
      padding: 80px 0;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5em;
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 1.2em;
      margin-bottom: 30px;
      opacity: .9;
    }
    .btn {
      display: inline-block;
      background: #ffcc00;
      color: #333;
      padding: 12px 32px;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn:hover { background: #ffdb4d; }

    /* ===== 核心优势 ===== */
    .advantages {
      padding: 60px 0;
      background: #f8f9fa;
    }
    .section-title {
      text-align: center;
      font-size: 1.8em;
      margin-bottom: 40px;
      color: #0056b3;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      text-align: center;
    }
    .card h3 {
      color: #0056b3;
      margin-bottom: 12px;
    }

    /* ===== 产品分类 ===== */
    .products {
      padding: 60px 0;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .product-item {
      border: 1px solid #eee;
      border-radius: 6px;
      overflow: hidden;
    }
    .product-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #ddd;
    }
    .product-item .info {
      padding: 16px;
    }
    .product-item h4 {
      color: #0056b3;
      margin-bottom: 8px;
    }

    /* ===== 应用场景 ===== */
    .scenarios {
      padding: 60px 0;
      background: #f8f9fa;
    }
    .scenario-item {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 30px;
    }
    .scenario-item:nth-child(even) {
      flex-direction: row-reverse;
    }
    .scenario-item img {
      width: 45%;
      border-radius: 6px;
      background: #ddd;
      height: 200px;
      object-fit: cover;
    }
    .scenario-text { width: 55%; }

    /* ===== 底部 ===== */
    footer {
      background: #222;
      color: #ccc;
      padding: 40px 0 20px;
    }
    footer .container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    footer h4 { color: #fff; margin-bottom: 12px; }
    footer p { margin-bottom: 6px; font-size: 0.9em; }
    .copyright {
      text-align: center;
      margin-top: 30px;
      padding-top: 16px;
      border-top: 1px solid #444;
      font-size: 0.85em;
      color: #888;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero h1 { font-size: 1.8em; }
      .scenario-item, .scenario-item:nth-child(even) {
        flex-direction: column;
      }
      .scenario-item img, .scenario-text { width: 100%; }
    }
  </style>
</head>
<body
